<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Secure Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Instagram Secret Mode */
        .insta-mode {
            background-color: #000000 !important;
            color: #ffffff !important;
        }
        .insta-mode .app-header {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888) !important;
        }
        .insta-mode .chat-area {
            background-color: #121212 !important;
        }
        .insta-mode .msg-me {
            background-color: #3797f0 !important;
            color: #ffffff !important;
        }
        .insta-mode .msg-other {
            background-color: #262626 !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body class="bg-gray-200 h-screen flex flex-col font-sans transition-all duration-300">

    <!-- Header (WhatsApp Light Style) -->
    <div id="header-bar" class="app-header bg-[#075e54] text-white p-3.5 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-emerald-800 flex items-center justify-center font-bold">
                <i data-lucide="user"></i>
            </div>
            <div>
                <!-- Secret Trigger: Click 5 times on 'Chats' -->
                <h1 id="title-text" onclick="triggerSecretTheme()" class="font-bold text-base cursor-pointer select-none">
                    Chats <span class="text-[10px] text-emerald-200 font-normal">(Tap 5x for Secret Mode)</span>
                </h1>
                <p id="user-tag" class="text-xs text-emerald-100"></p>
            </div>
        </div>
        <div class="flex gap-4">
            <i data-lucide="video" class="cursor-pointer"></i>
            <i data-lucide="phone" class="cursor-pointer"></i>
            <i data-lucide="more-vertical" class="cursor-pointer"></i>
        </div>
    </div>

    <!-- Chat Messages Window -->
    <div id="chat-window" class="chat-area flex-1 overflow-y-auto p-4 space-y-3 bg-[#efeae2]">
        <!-- Messages appear here -->
    </div>

    <!-- Controls / Input -->
    <div id="control-bar" class="bg-[#f0f2f5] p-2.5 flex items-center gap-2 border-t">
        <button onclick="document.getElementById('file-input').click()" class="text-gray-600 p-2 hover:bg-gray-200 rounded-full">
            <i data-lucide="paperclip" class="w-5 h-5"></i>
        </button>
        <input type="file" id="file-input" accept="image/*,video/*,audio/*" class="hidden" onchange="attachMedia(event)">

        <input type="text" id="msg-input" placeholder="Type a message..." class="flex-1 bg-white p-2.5 rounded-full text-sm focus:outline-none shadow-sm">
        
        <button onclick="pushMessage()" class="bg-[#00a884] text-white p-2.5 rounded-full hover:bg-emerald-600 shadow-md">
            <i data-lucide="send" class="w-5 h-5"></i>
        </button>
    </div>

    <script>
        lucide.createIcons();

        let tapCounter = 0;
        let myUser = localStorage.getItem('chat_user') || 'User_' + Math.floor(Math.random() * 1000);
        localStorage.setItem('chat_user', myUser);
        document.getElementById('user-tag').innerText = 'You: ' + myUser;

        // Pre-configured JSONBin Credentials
        const BIN_ID = "6addf3a8ffd5d160538a58e6";
        const API_KEY = "$2a$10$pI4R3W9UsoJ4ybW78fotNugUrCJDiysHmy/Spjr4rEhGcq4E7mHve";

        loadChats();

        // Secret Instagram Theme Switcher
        function triggerSecretTheme() {
            tapCounter++;
            if (tapCounter >= 5) {
                document.body.classList.toggle('insta-mode');
                const isInsta = document.body.classList.contains('insta-mode');
                document.getElementById('title-text').innerText = isInsta ? "Instagram Direct" : "Chats";
                tapCounter = 0;
            }
        }

        // Load Messages from Permanent JSONBin
        async function loadChats() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const data = await res.json();
                const messages = data.record.messages || [];
                renderUI(messages);
            } catch (err) {
                console.error("Error loading chats:", err);
            }
        }

        function renderUI(messages) {
            const win = document.getElementById('chat-window');
            win.innerHTML = '';

            messages.forEach(m => {
                if (m.deletedFor && m.deletedFor.includes(myUser)) return;

                const isMe = m.sender === myUser;
                const box = document.createElement('div');
                box.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;

                let mediaContent = '';
                if (m.mediaType === 'image') {
                    mediaContent = `<img src="${m.media}" class="rounded-lg max-w-xs max-h-52 object-cover my-1">`;
                } else if (m.mediaType === 'video') {
                    mediaContent = `<video src="${m.media}" controls class="rounded-lg max-w-xs max-h-52 my-1"></video>`;
                }

                box.innerHTML = `
                    <div class="${isMe ? 'msg-me bg-[#d9fdd3]' : 'msg-other bg-white'} p-3 rounded-lg shadow max-w-xs text-sm relative group">
                        <p class="text-[10px] text-gray-500 font-bold mb-0.5">${m.sender}</p>
                        ${m.text ? `<p class="break-words">${m.text}</p>` : ''}
                        ${mediaContent}
                        <button onclick="softDelete('${m.id}')" class="text-[9px] text-red-500 mt-1 opacity-0 group-hover:opacity-100 block hover:underline">Delete Chat</button>
                    </div>
                `;
                win.appendChild(box);
            });
            win.scrollTop = win.scrollHeight;
        }

        async function pushMessage(textVal = '', mediaVal = '', mediaTypeVal = '') {
            const input = document.getElementById('msg-input');
            const text = textVal || input.value.trim();
            if (!text && !mediaVal) return;

            if (!textVal) input.value = '';

            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            const data = await res.json();
            const list = data.record.messages || [];

            list.push({
                id: 'msg_' + Date.now(),
                sender: myUser,
                text: text,
                media: mediaVal,
                mediaType: mediaTypeVal,
                deletedFor: []
            });

            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify({ messages: list })
            });

            loadChats();
        }

        function attachMedia(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const mediaType = file.type.startsWith('video') ? 'video' : 'image';
                pushMessage('', e.target.result, mediaType);
            };
            reader.readAsDataURL(file);
        }

        async function softDelete(msgId) {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            const data = await res.json();
            let list = data.record.messages || [];

            list = list.map(m => {
                if (m.id === msgId) {
                    m.deletedFor = m.deletedFor || [];
                    m.deletedFor.push(myUser);
                }
                return m;
            });

            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify({ messages: list })
            });

            loadChats();
        }

        setInterval(loadChats, 4000); // ऑटो-अपडेट हर 4 सेकंड में
    </script>
</body>
</html>
